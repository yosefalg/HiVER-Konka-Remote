name: Build HiVER Konka Remote

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify IR profiles and offline permissions
        run: |
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "Internet permission is forbidden"
            exit 1
          fi
          mkdir -p build/profile-test
          javac -d build/profile-test \
            app/src/main/java/com/yosef/konkaremote/RemoteProfiles.java \
            tools/ProfileIntegrityCheck.java
          java -cp build/profile-test com.yosef.konkaremote.ProfileIntegrityCheck
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HiVER-Konka-Remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
