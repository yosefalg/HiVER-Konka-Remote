name: Build HiVER Konka Remote

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify IR profiles, timings and offline permissions
        run: |
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' app/src/main/AndroidManifest.xml; then
            echo "Network permissions are forbidden"
            exit 1
          fi
          if grep -Eiq 'admob|play-services-ads|facebook.*audience' app/build.gradle; then
            echo "Ad SDK dependencies are forbidden"
            exit 1
          fi
          mkdir -p build/profile-test
          javac -Xlint:all -Werror -d build/profile-test \
            app/src/main/java/com/yosef/konkaremote/RemoteProfiles.java \
            app/src/main/java/com/yosef/konkaremote/IrSignalPatterns.java \
            tools/ProfileIntegrityCheck.java
          java -cp build/profile-test com.yosef.konkaremote.ProfileIntegrityCheck
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HiVER-Konka-Remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
